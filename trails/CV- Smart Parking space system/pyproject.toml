[project]
name = "intelligent-parking"
version = "1.0.0"
description = "Intelligent Parking Space Detection — YOLOv8 + OpenCV"
requires-python = ">=3.11"

dependencies = [
    "ultralytics>=8.4.0",
    "opencv-python>=4.10.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "numpy>=1.26.0",
    "pillow>=10.3.0",
    "streamlit>=1.58.0",
    "opencv-python-headless>=4.13.0.92",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
package = false
